plugins {
    id 'com.android.application'
}

android {
    // Keep one Java/JNI namespace for both variants. The install package ID can still differ per flavor.
    namespace 'com.ast.ut99'
    compileSdk 35

    // NDK r23 is the last NDK release that supports Android Jelly Bean
    // (API 16-18). Pin it explicitly so a newer locally installed NDK does
    // not silently raise the native minimum to API 19/21 and break OUYA.
    // arm64-v8a is automatically built with its architectural minimum API 21.
    ndkVersion '23.2.8568313'

    // AGP 8 disables BuildConfig generation by default; UT99 reads VERSION_NAME from it.
    buildFeatures {
        buildConfig true
    }

    flavorDimensions 'platform'
    productFlavors {
        // Default Android/OUYA build. minSdk 16 keeps Android 4.1.2 / OUYA compatibility.
        normal {
            dimension 'platform'
            applicationId 'com.ast.ut99'
            minSdk 16
        }

        // Dedicated Google Play / Android Automotive OS package.
        automotive {
            dimension 'platform'
            applicationId 'com.ast.ut99android'
            // The previous dedicated Automotive build already used API 21.
            // Keeping this separate prevents the AAOS artifact from inheriting
            // the Jelly Bean native baseline needed only by Normal/OUYA.
            minSdk 21
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
        }
    }

    defaultConfig {
        targetSdk 35
        versionCode 14
        versionName '2.1.0'

        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a'
        }

        externalNativeBuild {
            cmake {
                abiFilters 'armeabi-v7a', 'arm64-v8a'
                cppFlags '-std=c++17 -fexceptions -frtti -fsigned-char -DANDROID -DPLATFORM_ANDROID'
                // Android 4.1.2 / OUYA cannot reliably resolve a transitive libc++_shared.so.
                // Link the bridge/entry libraries against the static C++ runtime instead.
                arguments '-DANDROID_STL=c++_static'
            }
        }
    }

    sourceSets {
        main {
            // fetch_deps.ps1 downloads SDL2 under the project root.
            java.srcDirs = [
                    'src/main/java',
                    rootProject.file('third_party/SDL2/android-project/app/src/main/java')
            ]
            assets.srcDirs = ['src/main/assets']
            jniLibs.srcDirs = ['src/main/jniLibs']
        }
    }

    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.22.1'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging true
        }
    }
}

// Android Studio should always default to the normal Android/OUYA build when using Run/Play.
// The Automotive flavor is release-only because its intended artifact is an AAB.
androidComponents {
    beforeVariants(selector().all()) { variantBuilder ->
        if (variantBuilder.name == 'automotiveDebug') {
            variantBuilder.enable = false
        }
    }
}

// Convenience tasks with explicit artifact intent.
tasks.register('buildNormalApk') {
    group = 'build'
    description = 'Builds the normal Android/OUYA debug APK.'
    dependsOn 'assembleNormalDebug'
}

tasks.register('buildAutomotiveAab') {
    group = 'build'
    description = 'Builds the Android Automotive release AAB.'
    dependsOn 'bundleAutomotiveRelease'
}
