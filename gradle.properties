# Keep Gradle memory sane for the native build.
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8

# AndroidX is intentionally off; this is a small SDL/native project.
android.useAndroidX=false
android.enableJetifier=false
android.nonTransitiveRClass=false

# AGP 8.6.x requires JDK 17.
# Do not pin org.gradle.java.home to the old Android Studio 2022 JBR here.
# Select JDK 17 / a current Android Studio Embedded JDK in the IDE instead.
